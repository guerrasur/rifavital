name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy live site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIFAVITAL }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            npx --yes firebase-tools@latest deploy --only hosting --project rifavital --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest deploy --only hosting --project rifavital --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Falta configurar FIREBASE_SERVICE_ACCOUNT_RIFAVITAL o FIREBASE_TOKEN en los secrets del repo."
            exit 1
          fi
