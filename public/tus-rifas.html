<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <title>Tus rifas — Fiebre de otoño</title>
  <link rel="stylesheet" href="/styles.css?v=1.10.0">
</head>
<body class="buyer-page">
  <main class="buyer-shell">
    <p class="buyer-brand">Fiebre de otoño</p>
    <h1>Tus rifas:</h1>
    <p id="buyerLoading" role="status">Cargando…</p>
    <div id="buyerRaffles" class="buyer-carousel" tabindex="0" aria-label="Tus cartas de rifa" hidden></div>
    <div id="buyerControls" class="buyer-carousel-controls" hidden>
      <button id="buyerPrevious" type="button" aria-label="Rifa anterior">‹</button>
      <p id="buyerPosition" role="status" aria-live="polite" aria-atomic="true"></p>
      <button id="buyerNext" type="button" aria-label="Rifa siguiente">›</button>
    </div>
    <p id="buyerError" role="status" hidden></p>
    <button id="buyerRetry" class="button-light" type="button" hidden>Reintentar</button>
    <div class="buyer-motion-controls">
      <button id="motionToggle" class="card-motion-toggle" type="button" aria-pressed="false" aria-describedby="motionHint" hidden>Activar movimiento</button>
      <p id="motionHint" class="card-motion-hint" role="status" hidden></p>
    </div>
  </main>
  <script type="module" src="/tus-rifas.js?v=1.10.0"></script>
</body>
</html>
